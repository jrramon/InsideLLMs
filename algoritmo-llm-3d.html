<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El algoritmo de un LLM · visita guiada 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0E0E16;color:#EDECE4;font:15px/1.55 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
header{position:fixed;top:14px;left:16px;z-index:3;pointer-events:none}
.brand{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#A8A6B8}
.brand b{color:#EDECE4;font-weight:700}
.brand i{font-style:normal;color:#EF9F27}
#hint{position:fixed;top:14px;right:16px;z-index:3;font-size:12px;color:#B9B7C8;background:rgba(18,17,30,.6);border:1px solid rgba(237,236,228,.13);padding:7px 12px;border-radius:999px;backdrop-filter:blur(8px);transition:opacity .9s}
#hint.off{opacity:0}
#panel{position:fixed;left:14px;right:14px;bottom:14px;z-index:3;max-width:500px;background:rgba(18,17,30,.8);border:1px solid rgba(237,236,228,.14);border-radius:14px;padding:16px 18px 13px;backdrop-filter:blur(14px)}
.eyebrow{font-size:11px;letter-spacing:.2em;color:#EF9F27;font-weight:700;margin-bottom:6px}
h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:21px;line-height:1.22;margin-bottom:7px;letter-spacing:.01em}
#stepBody{max-height:min(36vh,280px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#stepGeneral{color:#DDDCE6;font-size:13.5px}
#stepText{color:#B9B7C8;font-size:13px;margin-top:9px;padding-left:10px;border-left:2px solid rgba(239,159,39,.55)}
#controls{display:flex;align-items:center;gap:12px;margin-top:13px}
#controls button{appearance:none;background:transparent;border:1px solid rgba(237,236,228,.22);color:#EDECE4;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;transition:border-color .2s,color .2s,opacity .2s;flex:none}
#controls button:hover:not(:disabled){border-color:#EF9F27;color:#EF9F27}
#controls button:disabled{opacity:.3;cursor:default}
#controls button:focus-visible{outline:2px solid #EF9F27;outline-offset:2px}
#dots{display:flex;gap:7px;flex:1;justify-content:center;flex-wrap:wrap}
#dots .dot{width:8px;height:8px;min-width:8px;border-radius:50%;background:rgba(237,236,228,.18);border:none;padding:0;cursor:pointer}
#dots .dot.on{background:#EF9F27}
#dots .dot:hover{background:rgba(239,159,39,.65)}
#dots .dot:focus-visible{outline:2px solid #EF9F27;outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(237,236,228,.1);font-size:11px;color:#A8A6B8}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
#fallback{display:none;position:fixed;inset:0;z-index:5;background:#0E0E16;place-items:center;text-align:center;padding:30px}
#fallback.show{display:grid}
@media (min-width:760px){#panel{left:22px;bottom:22px;right:auto;width:500px}}
@media (max-width:560px){h2{font-size:18px}#stepText{font-size:13px}.legend{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><div class="brand">El <b>algoritmo</b> de un LLM · <i>visita guiada 3D</i></div></header>
<div id="hint">Arrastra para girar · rueda o pellizco para acercar</div>
<nav id="panel" aria-label="Guía por pasos">
  <div class="eyebrow" id="stepEyebrow"></div>
  <h2 id="stepTitle"></h2>
  <div id="stepBody">
    <p id="stepGeneral"></p>
    <p id="stepText"></p>
  </div>
  <div id="controls">
    <button id="prev" aria-label="Paso anterior">←</button>
    <div id="dots" role="tablist" aria-label="Pasos"></div>
    <button id="next" aria-label="Paso siguiente">→</button>
  </div>
  <div class="legend">
    <span><i style="background:#8a8a82"></i>vector h</span>
    <span><i style="background:#6c63d4"></i>matrices W (parámetros)</span>
    <span><i style="background:#17a673"></i>k · v</span>
    <span><i style="background:#EF9F27"></i>q · pesos · Δ</span>
  </div>
</nav>
<div id="fallback"><p>No se ha podido iniciar WebGL o cargar Three.js.<br>Prueba en un navegador de escritorio reciente con conexión.</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
//JS-START
(function(){
'use strict';
var fb=document.getElementById('fallback');
if(!window.THREE){fb.classList.add('show');return;}
var canvas=document.getElementById('c');
var renderer;
try{
  renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
}catch(err){fb.classList.add('show');return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0e0e16);
scene.fog=new THREE.Fog(0x0e0e16,170,540);
var camera=new THREE.PerspectiveCamera(46,2,0.1,900);

scene.add(new THREE.HemisphereLight(0x8f8cc0,0x141420,0.9));
var key=new THREE.DirectionalLight(0xfff2dd,0.7);key.position.set(30,40,50);scene.add(key);
var rim=new THREE.DirectionalLight(0x6c63d4,0.35);rim.position.set(-40,20,-40);scene.add(rim);

var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var clamp=function(v,a,b){return Math.min(b,Math.max(a,v));};
var ease=function(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
var WORDS=['el','gato','negro','se','sentó'];
var seed=7;
function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function randVals(n,a){var o=[];for(var i=0;i<n;i++){o.push((rnd()*2-1)*(a||1));}return o;}
function fmt(v){return v.toFixed(2).replace('.',',').replace('-','−');}
function V(x,y,z){return new THREE.Vector3(x,y,z||0);}

/* ---------- helpers ---------- */
function lambert(color,opacity){
  var o=(opacity===undefined)?1:opacity;
  return new THREE.MeshLambertMaterial({color:color,transparent:o<1,opacity:o});
}
function basic(color,opacity){
  var o=(opacity===undefined)?1:opacity;
  return new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:o,depthWrite:false});
}
function box(w,h,d,color,opacity){
  return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),lambert(color,opacity));
}
function edges(mesh,color,opacity){
  var e=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),
    new THREE.LineBasicMaterial({color:color,transparent:true,opacity:(opacity===undefined)?0.5:opacity}));
  mesh.add(e);return e;
}
function outline(parent,w,h,d,x,y,z,color,op){
  var e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),
    new THREE.LineBasicMaterial({color:color,transparent:true,opacity:op}));
  e.position.set(x,y,z||0);parent.add(e);return e;
}
function beam(a,b,r,color,opacity){
  var d=new THREE.Vector3().subVectors(b,a);
  var len=d.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10,1,true),basic(color,opacity));
  m.position.copy(a).addScaledVector(d,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  return m;
}
function makeLabel(text,opts){
  opts=opts||{};
  var px=opts.px||84;
  var weight=opts.weight||600;
  var color=opts.color||'#EDECE4';
  var family=opts.serif?'Georgia, serif':'-apple-system, "Segoe UI", Arial, sans-serif';
  var pad=Math.round(px*0.5);
  var cv=document.createElement('canvas');
  var ctx=cv.getContext('2d');
  ctx.font=weight+' '+px+'px '+family;
  var w=Math.ceil(ctx.measureText(text).width)+pad*2;
  cv.width=w;cv.height=px*2;
  var c2=cv.getContext('2d');
  c2.font=weight+' '+px+'px '+family;
  c2.fillStyle=color;
  c2.globalAlpha=(opts.alpha===undefined)?1:opts.alpha;
  c2.textBaseline='middle';
  c2.fillText(text,pad,px);
  var tex=new THREE.CanvasTexture(cv);
  tex.minFilter=THREE.LinearFilter;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  var h=opts.size||1.4;
  sp.scale.set(h*(cv.width/cv.height),h,1);
  return sp;
}
/* lab: label placed in a parent; align 'left' / 'right' anchors that edge at x */
function lab(parent,text,x,y,z,opts){
  opts=opts||{};
  var s=makeLabel(text,opts);
  var ax=(opts.align==='left')?s.scale.x/2:(opts.align==='right')?-s.scale.x/2:0;
  s.position.set(x+ax,y,z||0);parent.add(s);return s;
}
var pulses=[],cpulses=[],anims=[];
function addPulse(parent,a,b,color,speed,offset,r){
  var s=new THREE.Mesh(new THREE.SphereGeometry(r||0.15,10,10),basic(color,0.95));
  parent.add(s);
  pulses.push({m:s,a:a.clone(),b:b.clone(),t:offset||0,sp:speed||0.5});
}
function addCPulse(parent,curve,color,speed,offset,r){
  var s=new THREE.Mesh(new THREE.SphereGeometry(r||0.13,10,10),basic(color,0.95));
  parent.add(s);
  cpulses.push({m:s,c:curve,t:offset||0,sp:speed||0.4});
}
function region(x){var g=new THREE.Group();g.position.x=x;scene.add(g);return g;}
function regionLabel(g,text,y){
  var s=makeLabel(text,{size:1.5,alpha:0.9,weight:700});
  s.position.set(0,y,0);g.add(s);
}

/* ---------- numbers as cells ---------- */
var geoCache={};
function cellMesh(w,h,d,color){
  var k=w+'_'+h+'_'+d;
  var g=geoCache[k]||(geoCache[k]=new THREE.BoxGeometry(w,h,d));
  return new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:color}));
}
var MAPS={
  vec:[0x24232e,0x6a6973,0xedece4],
  par:[0x17152b,0x4d4694,0xb9b2ff],
  q:[0x4a2e08,0xef9f27,0xffe3b0],
  k:[0x0b3b2b,0x17a673,0x8ff0c8],
  v:[0x06291d,0x0f7a55,0x5fd3a6],
  hf:[0x0b3b2b,0x2f8f6b,0xb8f0d8]
};
function mapColor(map,v){
  var m=MAPS[map],o=new THREE.Color(m[1]);
  v=clamp(v,-1,1);
  return (v<0)?o.lerp(new THREE.Color(m[0]),-v):o.lerp(new THREE.Color(m[2]),v);
}
/* a vector: one cell per number, vertical by default */
function strip(parent,vals,o){
  var c=o.cell||0.4,g=(o.gap===undefined)?0.06:o.gap,st=c+g,n=vals.length,len=n*st-g,out=[];
  var horiz=(o.dir==='h'),dp=o.depth||0.36;
  for(var i=0;i<n;i++){
    var m=cellMesh(c,c,dp,mapColor(o.map||'vec',vals[i]));
    var off=-len/2+c/2+i*st;
    if(horiz){m.position.set(o.x+off,o.y,o.z||0);}else{m.position.set(o.x,o.y-off,o.z||0);}
    parent.add(m);out.push(m);
  }
  outline(parent,(horiz?len:c)+0.16,(horiz?c:len)+0.16,dp+0.08,o.x,o.y,o.z||0,0xedece4,0.22);
  out.len=len;return out;
}
/* a matrix: rows × cols cells */
function grid(parent,rows,cols,o){
  var c=o.cell||0.36,g=(o.gap===undefined)?0.05:o.gap,st=c+g,W=cols*st-g,H=rows*st-g,dp=o.depth||0.18,out=[];
  for(var i=0;i<rows;i++){
    out[i]=[];
    for(var j=0;j<cols;j++){
      var m=cellMesh(c,c,dp,mapColor(o.map||'par',o.val?o.val(i,j):(rnd()*2-1)));
      m.position.set(o.x-W/2+c/2+j*st,o.y+H/2-c/2-i*st,o.z||0);
      parent.add(m);out[i][j]=m;
    }
  }
  outline(parent,W+0.25,H+0.25,dp+0.1,o.x,o.y,o.z||0,0x8f86ff,0.45);
  out.W=W;out.H=H;out.st=st;out.c=c;return out;
}

/* ---------- world ---------- */
var floor=new THREE.GridHelper(420,126,0x2a2a3c,0x1a1a28);
floor.position.set(72,-4,0);scene.add(floor);
var rail=box(262,0.06,0.06,0x6c63d4,0.45);
rail.position.set(72,-3.85,0);scene.add(rail);
(function(){ /* parameter dust */
  var N=1300,pos=new Float32Array(N*3);
  for(var i=0;i<N;i++){
    pos[i*3]=-64+Math.random()*272;
    pos[i*3+1]=-5+Math.random()*24;
    pos[i*3+2]=-34+Math.random()*68;
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6c63d4,size:0.16,transparent:true,opacity:0.38,depthWrite:false})));
})();
(function(){ /* sections */
  [[-24,'A · ENTRENAMIENTO'],[96,'B · USO: UNA PREDICCIÓN'],[192,'C · GENERAR']].forEach(function(s){
    var l=makeLabel(s[1],{size:2.4,weight:700,color:'#EF9F27',alpha:0.9});
    l.position.set(s[0],18,0);scene.add(l);
  });
  [12,180].forEach(function(x){scene.add(beam(V(x,-4,0),V(x,19.5,0),0.05,0xef9f27,0.22));});
  /* B2–B5 together are one transformer block */
  scene.add(beam(V(37,15.2,0),V(131,15.2,0),0.05,0x8f86ff,0.6));
  [37,131].forEach(function(x){scene.add(beam(V(x,14.4,0),V(x,15.2,0),0.05,0x8f86ff,0.6));});
  var tb=makeLabel('B2 – B5 = un bloque transformer · se repite 32 veces',{size:1.1,weight:700,color:'#b9b2ff'});
  tb.position.set(84,16.0,0);scene.add(tb);
})();

var RA1=region(-48),RA2=region(-24),RA3=region(0),
    RB1=region(24),RB2=region(48),RB3=region(72),RB4=region(96),RB5=region(120),RB6=region(144),RB7=region(168),
    RC1=region(192);

/* A1 · tokenizador */
(function(){
  var rows=[['s','e','n','t','ó'],['s','en','t','ó'],['sen','t','ó'],['sent','ó'],['sentó']];
  var fresh=[-1,1,0,0,0];
  var rules=['caracteres sueltos','fusión 1 · e + n → en','fusión 2 · s + en → sen','fusión 3 · sen + t → sent','fusión 4 · sent + ó → sentó'];
  var ys=[6.4,4.5,2.6,0.7,-1.2],CW=0.95,GAP=0.3;
  rows.forEach(function(r,ri){
    var widths=r.map(function(s){return CW*s.length;});
    var tot=widths.reduce(function(a,b){return a+b;},0)+GAP*(r.length-1),x=-3-tot/2;
    r.forEach(function(s,i){
      var w=widths[i],isF=(i===fresh[ri]);
      var b=box(w,1.1,0.8,isF?0xef9f27:0x4a4952,1);b.position.set(x+w/2,ys[ri],0);RA1.add(b);
      edges(b,isF?0xffd27a:0x9a99a8,0.4);
      lab(RA1,s,x+w/2,ys[ri],0.6,{size:0.75,color:isF?'#1a1206':'#EDECE4',weight:isF?700:600});
      x+=w+GAP;
    });
    lab(RA1,rules[ri],1.6,ys[ri],0,{size:0.58,alpha:0.85,color:ri?'#ffd27a':'#A8A6B8',align:'left'});
  });
  var bar=box(17,1.5,1.3,0xef9f27,0.1);bar.position.set(0.5,ys[0],0);RA1.add(bar);
  anims.push({
    tick:function(t){
      var c=(t*0.45)%5,ri=Math.floor(c),f=c-ri;
      bar.position.y=ys[ri];
      bar.material.opacity=0.03+0.14*Math.sin(Math.PI*f);
    },
    still:function(){bar.position.y=ys[4];bar.material.opacity=0.12;}
  });
  lab(RA1,'vocabulario final: ~128 000 tokens · cada uno con su número (ID)',0,-3,2.4,{size:0.66,alpha:0.7});
  regionLabel(RA1,'A1 · Tokenizador (BPE)',9);
})();

/* A2 · parámetros al azar */
(function(){
  grid(RA2,12,5,{x:-7.8,y:3,cell:0.4});
  lab(RA2,'E',-7.8,6.4,0,{size:0.8});
  lab(RA2,'128 000 × 4 096',-7.8,-0.3,0,{size:0.5,alpha:0.75});
  var L=[['W_Q',-2.4,5.1],['W_K',0.6,5.1],['W_V',3.6,5.1],['W_O',-2.4,1.3],['W_up',0.6,1.3],['W_down',3.6,1.3]];
  L.forEach(function(m){
    grid(RA2,5,5,{x:m[1],y:m[2],cell:0.34});
    lab(RA2,m[0],m[1],m[2]+1.45,0,{size:0.55});
  });
  strip(RA2,[0.6,0.6,0.6,0.6,0.6,0.6,0.6,0.6],{x:-0.6,y:-0.2,cell:0.22,gap:0.04,dir:'h',map:'par'});
  lab(RA2,'normalización · × 2',0.9,-0.2,0,{size:0.45,alpha:0.85,align:'left'});
  outline(RA2,9.6,8.2,0.4,0.6,3.4,0,0x8f86ff,0.55);
  for(var k=1;k<=3;k++){
    var gh=box(9.6,8.2,0.05,0x3d3880,0.12);gh.position.set(0.6,3.4,-1.2*k);RA2.add(gh);edges(gh,0x8f86ff,0.28);
  }
  lab(RA2,'capa ℓ · × 32 capas',0.6,8.1,0,{size:0.6,color:'#ffd27a'});
  grid(RA2,5,8,{x:8.7,y:3,cell:0.34});
  lab(RA2,'W_U',8.7,4.6,0,{size:0.6});
  lab(RA2,'4 096 × 128 000',8.7,1.4,0,{size:0.5,alpha:0.75});
  lab(RA2,'≈ 8 000 millones de números · las matrices, aleatorias al empezar',0.5,-2.5,2,{size:0.66,alpha:0.7});
  regionLabel(RA2,'A2 · Parámetros al azar',10.2);
})();

/* A3 · bucle de entrenamiento */
(function(){
  var R=5.8,cy=3.4,pts=[];
  for(var i=0;i<36;i++){
    var a=Math.PI/2-i/36*Math.PI*2;
    pts.push(V(Math.cos(a)*R,cy+Math.sin(a)*R,0));
  }
  var ring=new THREE.CatmullRomCurve3(pts,true);
  RA3.add(new THREE.Mesh(new THREE.TubeGeometry(ring,90,0.05,8,true),basic(0x8f86ff,0.5)));
  var names=['1 · texto real del corpus','2 · predecir (toda la parte B)','3 · error = −log p(token real)','4 · backprop: gradiente de cada número','5 · w ← w − η · gradiente'];
  var stations=[];
  for(var s=0;s<5;s++){
    var an=Math.PI/2-s*2*Math.PI/5,ca=Math.cos(an),sa=Math.sin(an);
    var px=ca*R,py=cy+sa*R;
    var st=new THREE.Mesh(new THREE.SphereGeometry(0.32,14,14),basic(0x8f86ff,0.95));
    st.position.set(px,py,0);RA3.add(st);stations.push(st);
    var side=(Math.abs(ca)<0.2)?null:(ca>0?'left':'right');
    lab(RA3,names[s],px+ca*0.75,py+sa*0.75+(side?0:0.25),0,{size:0.56,alpha:0.92,align:side});
  }
  var from=[],to=[],cells=[];
  var M=grid(RA3,7,7,{x:0,y:4.3,cell:0.38,val:function(){return 0;}});
  for(var r=0;r<7;r++){for(var c=0;c<7;c++){
    cells.push(M[r][c]);
    from.push(mapColor('par',rnd()*2-1));
    to.push(mapColor('par',Math.sin(r*0.9)*Math.cos(c*0.7+r*0.3)));
  }}
  var loss=function(u){return -1.1+1.7*Math.exp(-3.5*u)+0.07*Math.sin(u*37);};
  var lp=[];
  for(var u=0;u<=40;u++){lp.push(V(-2.2+4.4*u/40,loss(u/40),0));}
  RA3.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(lp),new THREE.LineBasicMaterial({color:0xb9b7c8,transparent:true,opacity:0.75})));
  RA3.add(beam(V(-2.3,-1.25,0),V(2.4,-1.25,0),0.02,0x8a8a82,0.5));
  lab(RA3,'error',-2.5,0.4,0,{size:0.45,alpha:0.75,align:'right'});
  var ldot=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,10),basic(0xef9f27,0.95));RA3.add(ldot);
  var rdot=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,12),basic(0xffd27a,0.95));RA3.add(rdot);
  function place(sv,rt){
    var k=ease(sv);
    for(var i=0;i<cells.length;i++){cells[i].material.color.copy(from[i]).lerp(to[i],k);}
    ldot.position.set(-2.2+4.4*sv,loss(sv),0.1);
    rdot.position.copy(ring.getPoint(rt));
    var act=Math.floor(rt*5)%5;
    stations.forEach(function(m,j){m.material.color.setHex(j===act?0xef9f27:0x8f86ff);});
  }

var cur=0,userYaw=0,userPitch=0,userZoom=1;
var elE=document.getElementById('stepEyebrow'),
    elT=document.getElementById('stepTitle'),
    elG=document.getElementById('stepGeneral'),
    elD=document.getElementById('stepText'),
    elBody=document.getElementById('stepBody'),
    bPrev=document.getElementById('prev'),
    bNext=document.getElementById('next'),
    dotsEl=document.getElementById('dots'),
    hintEl=document.getElementById('hint');
var dots=[];
STEPS.forEach(function(s,i){
  var d=document.createElement('button');
  d.className='dot';d.setAttribute('role','tab');
  d.setAttribute('aria-label','Ir al paso '+i);
  d.addEventListener('click',function(){goStep(i);});
  dotsEl.appendChild(d);dots.push(d);
});
function goStep(i){
  cur=clamp(i,0,STEPS.length-1);
  userYaw=0;userPitch=0;userZoom=1;
  var s=STEPS[cur];
  elE.textContent=s.e;elT.textContent=s.t;elG.textContent=s.g;elD.textContent=s.d;
  elBody.scrollTop=0;
  bPrev.disabled=(cur===0);bNext.disabled=(cur===STEPS.length-1);
  dots.forEach(function(d,j){d.classList.toggle('on',j===cur);});
}
bPrev.addEventListener('click',function(){goStep(cur-1);});
bNext.addEventListener('click',function(){goStep(cur+1);});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){goStep(cur+1);}
  if(e.key==='ArrowLeft'){goStep(cur-1);}
});
goStep(0);

/* ---------- camera rig ---------- */
var lookCur=new THREE.Vector3(),sph=new THREE.Spherical();
function desired(){
  var s=STEPS[cur];
  var t=new THREE.Vector3().fromArray(s.target);
  var off=new THREE.Vector3().fromArray(s.off);
  sph.setFromVector3(off);
  sph.theta+=userYaw;
  sph.phi=clamp(sph.phi+userPitch,0.18,Math.PI-0.25);
  sph.radius*=userZoom;
  var p=new THREE.Vector3().setFromSpherical(sph).add(t);
  return {p:p,t:t};
}
var d0=desired();
camera.position.copy(d0.p);lookCur.copy(d0.t);

/* ---------- input ---------- */
var ptrs=new Map(),drag=false,px=0,py=0,pinchD=0,hintHidden=false;
function hideHint(){if(!hintHidden){hintHidden=true;hintEl.classList.add('off');}}
setTimeout(hideHint,8000);
canvas.addEventListener('pointerdown',function(e){
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  drag=true;px=e.clientX;py=e.clientY;hideHint();
});
canvas.addEventListener('pointermove',function(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){
    var a=Array.from(ptrs.values());
    var d2=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
    if(pinchD>0){userZoom=clamp(userZoom*(pinchD/d2),0.45,2.4);}
    pinchD=d2;return;
  }
  if(!drag)return;
  userYaw-=(e.clientX-px)*0.005;
  userPitch-=(e.clientY-py)*0.004;
  userPitch=clamp(userPitch,-0.9,0.9);
  px=e.clientX;py=e.clientY;
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinchD=0;
  if(ptrs.size===0)drag=false;
}
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',function(e){
  e.preventDefault();
  userZoom=clamp(userZoom*(1+e.deltaY*0.001),0.45,2.4);
  hideHint();
},{passive:false});

/* ---------- loop ---------- */
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  /* shift the framing away from the panel: right of it on desktop, above it on phones */
  if(w>=760){camera.setViewOffset(w,h,-Math.min(160,w*0.11),h*0.07,w,h);}
  else{camera.setViewOffset(w,h,0,h*0.16,w,h);}
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

var last=performance.now(),time=0,placed=false;
function placeStatic(){
  pulses.forEach(function(p){p.m.position.lerpVectors(p.a,p.b,0.55);p.m.material.opacity=0.8;});
  cpulses.forEach(function(p){p.m.position.copy(p.c.getPoint(0.55));p.m.material.opacity=0.8;});
  anims.forEach(function(a){a.still();});
}
function tick(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;
  if(RM){
    if(!placed){placeStatic();placed=true;}
  }else{
    pulses.forEach(function(p){
      p.t=(p.t+dt*p.sp)%1;
      p.m.position.lerpVectors(p.a,p.b,ease(p.t));
      p.m.material.opacity=0.15+0.85*Math.sin(Math.PI*p.t);
    });
    cpulses.forEach(function(p){
      p.t=(p.t+dt*p.sp)%1;
      p.m.position.copy(p.c.getPoint(ease(p.t)));
      p.m.material.opacity=0.15+0.85*Math.sin(Math.PI*p.t);
    });
    anims.forEach(function(a){a.tick(time,dt);});
  }
  var d=desired();
  var cl=RM?1:0.055;
  camera.position.lerp(d.p,cl);
  lookCur.lerp(d.t,RM?1:0.075);
  camera.lookAt(lookCur);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
